name: Build and Release MACRIC

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Job 1: Build & Release Windows .exe Installer
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'electron/package-lock.json'

      - name: Install Electron dependencies
        working-directory: ./electron
        run: npm install

      - name: Build Windows Installer (MACRIC-Setup.exe)
        working-directory: ./electron
        run: npm run dist

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $exePath = "electron/dist/MACRIC-Setup.exe"
          if (Test-Path $exePath) {
            $hash = (Get-FileHash -Algorithm SHA256 $exePath).Hash
            Set-Content -Path "electron/dist/MACRIC-Setup.exe.sha256" -Value $hash
            Write-Host "Generated SHA256: $hash"
          } else {
            Write-Error "Installer binary $exePath was not found!"
            exit 1
          }

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            electron/dist/MACRIC-Setup.exe
            electron/dist/MACRIC-Setup.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Deploy Public Web Portal to GitHub Pages
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
